<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Clash-free college timetables in minutes. Enter rooms, teachers, classes and subjects; get a timetable with no clashes.">
  <title>ClashFree Timetables</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232456d6'/%3E%3Cpath d='M7 11h18M7 17h18M7 23h18M13 7v20M19 7v20' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <strong>ClashFree</strong>
        <span class="college-name" id="college-name"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="save-state" id="save-state" aria-live="polite"></span>
      <button type="button" class="btn ghost" id="btn-samples">Load sample</button>
      <button type="button" class="btn ghost" id="btn-import">Import</button>
      <button type="button" class="btn ghost" id="btn-export">Export</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </div>
  </header>

  <nav class="steps" id="steps" aria-label="Steps"></nav>

  <main id="main" tabindex="-1"></main>

  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
